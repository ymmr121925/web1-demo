<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web图鉴</title>
    <style>
      /* ==========所有标签统一清除浏览器默认边距，所有的注释主要是ai写的，部分我自己写的 ========== */
      * {
        margin: 0;
        padding: 0;
        /* border-box：边框、内边距不会撑大盒子宽度，初学重点 */
        box-sizing: border-box;
      }

      /* 页面整体,这个body是ai写的 */
      body {
        background-color: #f7f7f7;
        font-family: "Microsoft Yahei", sans-serif;
      }

      /* ========== 顶部栏 top_bar ========== */
      .top_bar {
        height: 60px;
        background-color: #ffffff;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0px 20px; /*padding与box-shadow是ai写的*/
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
      }
      .page_title {
        font-size: 22px;
        font-weight: bold;
        color: #ff385c;
      }
      .login_button {
        padding: 6px 16px;
        background-color: #ff385c;
        color: white;
        border-radius: 20px;
        cursor: pointer;
      }

      /* ========== 外层大盒子 wrap_box：侧边栏 + 主内容 ========== */
      .wrap_box {
        display: flex;
      }

      /* ========== 侧边导航 side_nav ========== */
      .side_nav {
        width: 180px;
        height: calc(100vh - 60px);
        background-color: white;
        padding-top: 30px; /*padding与position是ai写的*/
        position: fixed; /* 固定侧边栏，滚动页面不动，与main-content脱离同一层级 */
      }
      .side_nav .nav_item {
        display: block;
        width: 100%;
        padding: 12px 24px; /*整个盒子内部可用区域是去掉左右 24px 之后中间这一块。而文字在【中间这块可用区域】里，是从左往右写*/
        text-decoration: none; /*去掉a标签下划线 */
        color: #333;
      }
      .side_nav .nav_item:hover {
        background-color: #ffe8eb;
        color: #ff385c;
      }

      /* ========== 主内容区域 main_content ========== */
      .main_content {
        /* 左边留出侧边栏宽度，防止内容被盖住 */
        margin-left: 180px;
        margin-top: 20px;
        padding: 0 20px;
        width: calc(100% - 180px);
      }

      /* ========== 卡片容器 card_container 【重点！Grid布局，解决长条问题】 ========== */
      .card_container {
        display: grid; /* 开启网格布局，自动排成多列卡片 */
        /*最难的代码：
      repeat第一个参数：生成轨道的数量控制关键字 auto-fit：自动适配；会把没有卡片内容的空网格轨道收缩合并。 
      卡片数量少、浏览器窗口很宽时，卡片会自动拉伸铺满整行，更美观。 相较于auto-fit,auto-fill 会保留空轨道，容易出现大片留白
      repeat第二个参数：每一条列轨道的宽度规则 minmax(最小值, 最大值)：规定轨道宽度的上下界限，必须传两个参数 
      220px 👉 最小值：卡片宽度最低限制，再窄也不会小于220px；窗口缩小时，到达下限就自动换行 
      1fr 👉 最大值：fr是网格的弹性单位，代表一份剩余空间； 容器有多余空白的时候，所有卡片平分这份空白、同步加宽铺满一行 */
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 18px; /* 卡片之间的空隙 */
        height: auto; /* 高度由卡片自动撑开！！不要写height:100%，这是长条bug根源 */
      }

      /* ========== 单张卡片 card ========== */
      .card {
        background-color: white;
        border-radius: 12px;
        overflow: hidden; /* 圆角以外的图片裁掉 */
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        cursor: pointer;
        transition: transform 0.25s; /* 悬浮平滑动画 */
        /*注：height: auto; 高度随内容自动，禁止100% */
      }
      .card:hover {
        transform: scale(1.05); /* 鼠标放上去轻微放大 */
      }
      /* 卡片里的图片 */
      .card img {
        width: 100%;
        height: 160px; /* 统一图片高度，防止图片把卡片拉很高 */
        object-fit: cover; /* 图片不变形，多余部分裁掉 */
        display: block; /*display:block 是用来干掉 img 底部自带的默认小缝隙的，属于预防隐性 bug的代码*/
      }
      /* 卡片里面标题、描述文字 */
      .card h3 {
        font-size: 15px;
        margin: 10px 10px 6px;
      }
      .card p {
        font-size: 13px;
        color: #666;
        margin: 0 10px 8px;
      }
      /* 卡片底部作者+时间行 card_bottom_info */
      .card_bottom_info {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #999;
        padding: 0 10px 10px;
      }

      /* ========== 弹窗遮罩层 modal_mask（登录弹窗、详情弹窗共用） ========== */
      .modal_mask {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.5);
        display: none; /* 默认隐藏，JS控制显示 */
        align-items: center;
        justify-content: center;
        z-index: 50; /* 层级最高，浮在页面上面 */
      }
      /* 登录弹窗盒子 login_modal */
      .login_modal {
        width: 360px;
        background-color: white;
        padding: 30px;
        border-radius: 12px;
      }
      /* 登录弹窗里的标题 */
      .login_modal h2 {
        text-align: center;
        margin-bottom: 24px;
        color: #333;
      }
      /* 表单项容器（每一组 label + input） */
      .form_item {
        margin-bottom: 18px;
      }
      /* 输入框前面的文字标签 */
      .form_item label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
      }
      /* 用户名、密码输入框 */
      .form_item input {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
      }
      /* 登录提交按钮 */
      .submit_button {
        width: 100%;
        padding: 10px;
        background-color: #ff385c;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      /* 详情弹窗盒子 detail_modal */
      .detail_modal {
        width: 420px;
        background-color: white;
        border-radius: 12px;
        padding: 20px;
      }
      /* 详情弹窗里的大图 */
      .detail_modal img {
        width: 100%;
        height: 240px;
        object-fit: cover;
        border-radius: 8px;
      }
      /* 详情弹窗标题 */
      .detail_modal h3 {
        margin: 12px 0 8px;
      }
      /* 详情描述文本 */
      .detail_modal p {
        color: #555;
        line-height: 1.6;
      }
      /* 底部信息栏：作者、时间这一行 */
      .detail_bottom_info {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        color: #888;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- 顶部栏：标题 + 登录按钮 -->
    <header class="top_bar">
      <div class="page_title">Web图鉴</div>
      <button class="login_button" id="login_btn">登录</button>
    </header>

    <!-- 外层容器：侧边导航 + 主内容 -->
    <div class="wrap_box">
      <!-- 侧边导航 -->
      <nav class="side_nav">
        <a href="#" class="nav_item">首页</a>
        <a href="#" class="nav_item">发现</a>
        <a href="#" class="nav_item">收藏</a>
        <a href="#" class="nav_item">关于</a>
      </nav>
      <!-- 主内容区，卡片全部放在 card_wrap 里面，JS动态往这里添加卡片 -->
      <main class="main_content">
        <div class="card_container" id="card_wrap"></div>
      </main>
    </div>

    <!-- 登录弹窗：默认隐藏，点击登录按钮弹出 -->
    <div class="modal_mask" id="login_mask">
      <!-- 【遮罩层（半透明黑罩）】 -->
      <div class="login_modal">
        <!-- 弹窗内容盒子，放在遮罩里面 -->
        <h2>账号登录</h2>
        <form id="login_form">
          <div class="form_item">
            <label>用户名</label>
            <input type="text" id="user_name" required />
          </div>
          <div class="form_item">
            <label>密码</label>
            <input type="password" id="user_pwd" required />
          </div>
          <button type="submit" class="submit_button">登录</button>
        </form>
      </div>
    </div>

    <!-- 详情弹窗：点击卡片弹出详情 -->
    <!-- /*这里是我从豆包哪里学到的循环体系，卡片放在了js部分，可以省行数*/ -->
    <div class="modal_mask" id="detail_mask">
      <!-- 【详情弹窗的遮罩】 -->
      <div class="detail_modal">
        <!-- 详情弹窗内容盒子 -->
        <img id="detail_img" src="" alt="" />
        <h3 id="detail_title"></h3>
        <p id="detail_desc"></p>
        <div class="detail_bottom_info">
          <span id="detail_author"></span>
          <span id="detail_time"></span>
        </div>
      </div>
    </div>

    <script>
      // 一：卡片部分
      // 1，卡片相关资源（ai帮我整理后我复制的，但img的图片是我从网上找到）
      const postList = [
        {
          id: 1,
          title: "猫咪打卡",
          desc: "楼下遇到的小猫咪，乖乖的不怕人",
          img: "https://assets.699pic.com/public/img95/photo/60055/0594.jpg_wh860.jpg",
          author: "小明",
          time: "2026-10-01",
        },
        {
          id: 2,
          title: "校园晚霞",
          desc: "傍晚操场的晚霞超好看，适合散步",
          img: "https://ts2.tc.mm.bing.net/th/id/OIP-C.-76U0JKFrgObktcGxPbc3gHaFj?r=0&rs=1&pid=ImgDetMain&o=7&rm=3",
          author: "小红",
          time: "2026-10-02",
        },
        {
          id: 3,
          title: "美食分享",
          desc: "食堂新开的窗口，味道很不错",
          img: "https://assets.699pic.com/public/img95/photo/60018/3438.jpg_wh860.jpg",
          author: "阿华",
          time: "2026-10-03",
        },
        {
          id: 4,
          title: "路边小花",
          desc: "路边随手拍，不起眼但是很好看",
          img: "https://pic.nximg.cn/file/20251017/7280408_141830949105_2.jpg",
          author: "小李",
          time: "2026-10-04",
        },
        {
          id: 5,
          title: "图书馆日常",
          desc: "安静学习的一天，效率很高",
          img: "https://assets.699pic.com/public/img95/photo/50047/4432.jpg_wh860.jpg",
          author: "小张",
          time: "2026-10-05",
        },
      ];

      // 2，卡片容器
      const cardWrap = document.querySelector("#card_wrap");

      // 详情弹窗相关
      const detailMask = document.querySelector("#detail_mask");
      const detailModal = document.querySelector(".detail_modal");
      const detailImg = document.querySelector("#detail_img");
      const detailTitle = document.querySelector("#detail_title");
      const detailDesc = document.querySelector("#detail_desc");
      const detailAuthor = document.querySelector("#detail_author");
      const detailTime = document.querySelector("#detail_time");

      // 3， 渲染卡片函数
      function renderCards() {
        postList.forEach((item) => {
          //`postList` 就是存所有卡片信息的数组；`forEach` 遍历数组里每一条数据，每一条临时叫 `item`。
          // 创建卡片外层div
          const card = document.createElement("div");
          card.className = "card";
          card.dataset.id = item.id;

          // 图片
          const img = document.createElement("img");
          img.src = item.img;
          img.alt = item.title;

          // 标题
          const h3 = document.createElement("h3");
          h3.textContent = item.title;

          // 描述文本
          const p = document.createElement("p");
          p.textContent = item.desc;

          // 底部作者+时间容器
          const infoBox = document.createElement("div");
          infoBox.className = "card_bottom_info";

          const spanAuthor = document.createElement("span");
          spanAuthor.textContent = item.author;

          const spanTime = document.createElement("span");
          spanTime.textContent = item.time;

          infoBox.appendChild(spanAuthor);
          infoBox.appendChild(spanTime);

          // 组装卡片内部结构
          card.appendChild(img);
          card.appendChild(h3);
          card.appendChild(p);
          card.appendChild(infoBox);

          // 把卡片放进页面容器
          cardWrap.appendChild(card);
        });
        bindCardClick(); // 卡片渲染完成后，绑定点击事件，使renderCards()运行时，再运行 bindCardClick()
      }
      renderCards(); //执行代码，渲染卡片

      // 4，卡片点击事件：打开详情弹窗
      function bindCardClick() {
        const allCard = document.querySelectorAll(".card");
        allCard.forEach((card) => {
          card.onclick = function () {
            const cid = Number(this.dataset.id);
            const target = postList.find((item) => item.id === cid);

            // 填充详情内容，textContent安全赋值
            detailImg.src = target.img;
            detailImg.alt = target.title;
            detailTitle.textContent = target.title;
            detailDesc.textContent = target.desc;
            detailAuthor.textContent = target.author;
            detailTime.textContent = target.time;

            // 显示详情弹窗
            detailMask.style.display = "flex";
          };
        });
      }

      // 5，详情弹窗关闭
      detailMask.onclick = function () {
        detailMask.style.display = "none";
      };
      // 点击弹窗内部，阻止冒泡，不会关闭
      detailModal.onclick = function () {
        e.stopPropagation();
      };

      // 二：登录部分
      // 1，拿到登录相关元素
      const loginBtn = document.querySelector("#login_btn");
      const loginMask = document.querySelector("#login_mask");
      const loginModal = document.querySelector(".login_modal");
      const loginForm = document.querySelector("#login_form");

      // 2，点登录按钮，打开登录弹窗
      loginBtn.onclick = function () {
        loginMask.style.display = "flex";
      };
      // 3，点登录灰色遮罩，关闭弹窗
      loginMask.onclick = function () {
        loginMask.style.display = "none";
      };
      // 4，点击登录弹窗里面，阻止冒泡，不会关闭
      loginModal.onclick = function (e) {
        e.stopPropagation();
      };
      // 5，登录表单提交
      loginForm.onsubmit = function (e) {
        e.preventDefault();
        alert("登录成功！");
        loginForm.reset(); // 清空表单,恢复初始内容
        loginMask.style.display = "none";
      };
    </script>
    <!-- /*【整体原理：单弹窗复用方案】 
页面HTML只预先写好一套详情弹窗DOM结构，不会为每一张卡片单独生成弹窗；
 弹窗容器永久存在，默认隐藏。每次点击卡片时，只动态替换弹窗内部图片、文字内容，实现复用。 
【完整运行流程】
1. 数据源：postList数组存放全部6条卡片原始数据（id、标题、描述、图片、作者、时间）
2. renderCards()：遍历postList，动态创建每一张卡片DOM；
   并通过 card.dataset.id = item.id;，把本条卡片唯一id挂载到卡片元素身上，作为身份标记。
   全部卡片渲染完成后，执行 bindCardClick() 给卡片绑定点击事件。
3. bindCardClick()：获取页面上所有.card卡片，循环为每张卡片添加点击回调：
   ① this.dataset.id 获取当前点击卡片挂载的id（字符串），用Number转为数字存入cid；
   ② 使用数组方法find，拿着cid去postList匹配，查出对应的完整数据对象target；
   ③ 使用target里的数据，覆盖弹窗内部img、标题、描述、作者、时间等DOM内容；
   ④ 将弹窗遮罩display改为flex，弹窗显示。
4. 关闭弹窗：仅把弹窗遮罩设为display:none隐藏，弹窗DOM结构保留在页面；
   弹窗内旧内容不会自动清空，下次点击卡片时会被新的target数据直接覆盖刷新。
【关键优点】
只用一套弹窗DOM，减少页面元素，节省资源；不用重复创建、删除弹窗节点。
*/ -->
  </body>
</html>
