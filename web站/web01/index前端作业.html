<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>web试用期作业01</title>
  </head>
  <body>
    <h1>试用期第一次作业示例</h1>

    <form>
      <p>
        <input type="text" placeholder="请输入账号" />
      </p>

      <p>
        <input type="password" placeholder="请输入密码" />
      </p>

      <p>
        <img
          src="https://upload-bbs.miyoushe.com/upload/2023/05/17/7219256/5ecc6a38c74ab61158c80109a15a64c5_2329831830261413240.png"
          width="300px;"
          alt="图形验证码"
        />
      </p>请输入上方的图形验证码：
        <input type="text" placeholder="请输入图形验证码" />
      </p>

      <button>提交！通往下一站！</button>

      <p>你更喜欢前端还是后端？</p>

    <p>
      <label>
      <input type="radio" name="like" />喜欢前端
      </label>
    </p>
    <p>
      <label>
      <input type="radio" name="like" />不喜欢后端
      </label>
    </p>

      <p>你未来希望参加前端还是后端？</p>

     <p>
      <label>
    <input type="checkbox" name="future"/> 前端
      </label>
    </p>
    <p>
      <label>
    <input type="checkbox" name="future"/> 后端
      </label>
    </p>

      <p>请在下方填写此次听课反馈吧~</p>

      <textarea placeholder="请输入留言"></textarea>
    </form>
  </body>
</html>
