<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试用期作业2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            display: flex;
            background-image:url( C:/Users/ymoum/Downloads/textarea禁止调整大小样式.png);
            background-repeat: no-repeat;
            background-size: contain;/* 可以是可有可无 */
            /* background-color:#000; */
            background-position:center;
        }
        .left {
            width: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* padding: 30px; */
        }
        .left p {
            font-size: 18px;
            line-height: 2.2;
            color: #333333;
            letter-spacing: 2px;
            text-align: center;
            text-shadow:2px 2px 2px #f1a8d8;
        }
        .left .special-p {
            font-style: italic;
            color: #9b2688;
            margin-top: 30px;
            text-shadow:2px 2px 2px #f1a8d8;
        }
        .right {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            /* padding: 20px; */
            box-sizing: border-box;
        }
        form {
            background-color: rgba(250,250,250,0.2);
            backdrop-filter: blur(4px);
            border: 2px solid #f1a8d8;
            border-radius: 16px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap:16px;
        }
        .yanzheng {
            display: flex;
            align-items: center;
            gap:10px;
        }
        button {
            padding:6px;
            background-color:#e84e9c;
            color:white;
            border:none;
            border-radius:4px;
        }
    </style>
</head>
<body>
    <!-- 左半区 -->
    <div class="left">
        <p>流星划过夜空<br>
        生命的长河荡起涟漪<br>
        闪烁十三种光彩<br>
        衰丽松树的女儿<br>
        哺育「真我」的黄金裔<br>
        栽下记忆的种子<br>
        让往昔的花朵在明日绽放—
        </p>
        <p class="special-p">「然后，一起写下不同过往的结局吧。」</p>
    </div>

    <!-- 右半区 -->
    <div class="right">
        <form>
            <h3 style="text-align:center; color:#9b2688;">试用期第二次作业示例</h3>
            <p>
                <input type="text" placeholder="请输入账号">
            </p>
            <p>
                <input type="password" placeholder="请输入密码">
            </p>
            <div class="yanzheng">
                <img src="https://upload-bbs.miyoushe.com/upload/2023/05/17/7219256/5ecc6a38c74ab61158c80109a15a64c5_2329831830261413240.png" alt="图形验证码" width="160px">
                <span>图形验证码：</span>
                <input type="text" placeholder="请输入图形验证码">
            </div>
            <p>你更喜欢前端还是后端？</p>
            <p>
                <label>
                    <input type="radio" name="like"> 喜欢前端
                </label>
                <label>
                    <input type="radio" name="like"> 不喜欢后端
                </label>
            </p>
            <p>你未来希望参加前端还是后端？</p>
            <p>
                <label>
                    <input type="checkbox" name="future"> 前端
                </label>
                <label>
                    <input type="checkbox" name="future"> 后端
                </label>
            </p>
            <p>请在下方填写此次听课反馈：</p>
            <textarea placeholder="请输入留言" rows="3"></textarea>
            <button>提交！通往下一站！</button>
        </form>
    </div>
</body>
</html>

</html>
